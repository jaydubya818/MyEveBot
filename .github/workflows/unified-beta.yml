name: Unified beta exact-source qualification
'on':
  push:
    branches:
    - main
    - codex/unified-beta-myeve-20261011
    - codex/beta-qa-adoption-20261023
  pull_request:
    branches: [main]
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  builder-packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: npm ci --no-audit --no-fund
    - name: Builder contracts, types and source manifest
      run: |
        node --import tsx --test apps/builder/lib/*.test.ts
        npx tsc --project apps/builder/tsconfig.json --noEmit
        node --import tsx apps/builder/scripts/check-manifest.ts
    - name: Build with a synthetic untracked source tripwire
      env:
        NEXT_TELEMETRY_DISABLED: '1'
      run: |
        mkdir -p "$RUNNER_TEMP/builder-packaging"
        node --import tsx apps/builder/scripts/qualification-template-trace.ts --prepare
        npm run build --workspace=eveclaw-builder 2>&1 | tee "$RUNNER_TEMP/builder-packaging/build.log"
        cp apps/builder/.next/template-trace-verification.json "$RUNNER_TEMP/builder-packaging/trace-verification.json"
    - name: Verify exact traces, no-Git byte parity and tamper denial
      run: node --import tsx apps/builder/scripts/qualification-template-trace.ts 2>&1 | tee "$RUNNER_TEMP/builder-packaging/qualification.log"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: unified-builder-packaging
        path: ${{ runner.temp }}/builder-packaging
        if-no-files-found: warn
  myapps-alpha:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - run: npm ci --no-audit --no-fund
    - run: node node_modules/playwright/cli.js install --with-deps chromium
    - name: Retrieve the exact offline runtime image
      run: |
        docker pull --platform=linux/arm64 node@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
        node --import tsx --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {execFileSync} from 'node:child_process';
        import {appendFileSync,mkdirSync,writeFileSync} from 'node:fs';
        const artifact='node@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0';
        const [actual]=JSON.parse(execFileSync('docker',['image','inspect',artifact],{encoding:'utf8'}));
        assert.match(actual.Id,/^sha256:[a-f0-9]{64}$/);assert.equal(actual.Os,'linux');assert.equal(actual.Architecture,'arm64');
        assert.ok(actual.RepoDigests.includes(artifact));
        appendFileSync(process.env.GITHUB_ENV,'MYAPPS_ALPHA_TEST_IMAGE_ID='+actual.Id+'\n');
        const output=process.env.RUNNER_TEMP+'/myapps-alpha';mkdirSync(output,{recursive:true});
        writeFileSync(output+'/runtime-image.json',JSON.stringify({artifact,imageId:actual.Id,os:actual.Os,architecture:actual.Architecture},null,2));
        NODE
    - name: Existing CRM, strict source contracts and isolated candidate denial tests
      env:
        MYAPPS_ALPHA_DOCKER_TEST: '1'
      run: node --import tsx --test packages/myapps/test/*.test.mjs packages/myapps/test/alpha-tasks/*.test.mjs
    - name: Signed owner UI and real PostgreSQL installation, update, rollback and recovery
      env:
        MYAPPS_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
        MYAPPS_ALPHA_DOCKER_TEST: '1'
        MYAPPS_ALPHA_BROWSER_TEST: '1'
        MYAPPS_ALPHA_BROWSER_OUTPUT: ${{ runner.temp }}/myapps-alpha
      run: node_modules/.bin/vitest run --config packages/myapps/vitest.config.ts packages/myapps/integration/alpha-tasks.test.ts packages/myapps/integration/alpha-tasks-result.test.ts packages/myapps/integration/alpha-tasks-guard.test.ts packages/myapps/integration/alpha-tasks-recovery.test.ts packages/myapps/integration/alpha-tasks-late-worker.test.ts packages/myapps/integration/local-bootstrap.test.ts
    - name: Registered owner Result intake, human installation, Sofie and cold restart
      env:
        MYAPPS_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
        MYAPPS_ALPHA_DOCKER_TEST: '1'
      run: |
        node_modules/.bin/vitest run apps/eve/lib/missioncontrol/local-owner-apps.integration.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/myapps-alpha/registered-owner-journey.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/myapps-alpha/registered-owner-journey.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,1);assert.equal(result.numPassedTests,1);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,1);
        assert.equal(result.testResults[0].name,process.cwd()+'/apps/eve/lib/missioncontrol/local-owner-apps.integration.test.ts');
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
    - name: Dormant signed remote isolation, durable delivery and offline runtime
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
        MYAPPS_ALPHA_DOCKER_TEST: '1'
      run: |
        node_modules/.bin/vitest run --config packages/myapps/vitest.config.ts packages/myapps/integration/remote-isolation.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/myapps-alpha/remote-isolation.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/myapps-alpha/remote-isolation.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,44);assert.equal(result.numPassedTests,44);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,44);
        assert.ok(result.testResults[0].name.endsWith('/packages/myapps/integration/remote-isolation.test.ts'));
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
    - name: Canonical remote admission and immutable operation custody
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
      run: |
        node_modules/.bin/vitest run --config packages/myapps/vitest.config.ts packages/myapps/integration/canonical-remote-admission.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/myapps-alpha/canonical-remote-admission.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/myapps-alpha/canonical-remote-admission.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,51);assert.equal(result.numPassedTests,51);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,51);
        assert.ok(result.testResults[0].name.endsWith('/packages/myapps/integration/canonical-remote-admission.test.ts'));
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
    - name: Bounded signed HTTP and durable lost-response recovery
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
      run: |
        node_modules/.bin/vitest run --config packages/myapps/vitest.config.ts packages/myapps/integration/remote-http.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/myapps-alpha/remote-http.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/myapps-alpha/remote-http.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,44);assert.equal(result.numPassedTests,44);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,44);
        assert.ok(result.testResults[0].name.endsWith('/packages/myapps/integration/remote-http.test.ts'));
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: unified-alpha-tasks-browser
        path: ${{ runner.temp }}/myapps-alpha
        if-no-files-found: error
  composed-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: myeve
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: myeve
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: jaydubya818/MissionControl
        ref: f9bcd0df4bb970a36a43599b00d724b07f300ad0
        path: missioncontrol
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: jaydubya818/relay
        ref: f05a5639e2f95994778753e6021603ca5a1777fb
        path: relay
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 9.0.0
        package_json_file: missioncontrol/package.json
    - run: npm ci --no-audit --no-fund
    - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run ci:prepare
      working-directory: missioncontrol
    - run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: relay
    - name: Fetch checksum-qualified disposable Convex backend
      run: |
        curl --fail --location --output "$RUNNER_TEMP/convex.zip" https://github.com/get-convex/convex-backend/releases/download/precompiled-2026-09-28-5c7cb5b/convex-local-backend-x86_64-unknown-linux-gnu.zip
        echo "5b4adbe9fc2f9985c66eb12b19dadedf2700d8796c839ddba09802196099f241  $RUNNER_TEMP/convex.zip" | sha256sum --check
        unzip "$RUNNER_TEMP/convex.zip" -d "$RUNNER_TEMP/convex"
        chmod +x "$RUNNER_TEMP/convex/convex-local-backend"
    - name: Real Convex, Relay and MyEve admission with synthetic identity and FakeFactory
      env:
        COMPOSED_MC_ROOT: ${{ github.workspace }}/missioncontrol
        COMPOSED_RELAY_ROOT: ${{ github.workspace }}/relay
        MC_COMPATIBILITY_CONVEX_BINARY: ${{ runner.temp }}/convex/convex-local-backend
        MC_COMPATIBILITY_PORT: '3398'
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
      run: |
        mkdir -p "$RUNNER_TEMP/composed-admission"
        node --test scripts/composed-admission/*.test.mjs
        # Two required clean passes, not a retry: any failure stops the step.
        # Each journey creates and destroys its own Convex/PostgreSQL fixtures.
        for pass in 1 2; do
          COMPOSED_REPORT="$RUNNER_TEMP/composed-admission/standard-$pass.json" node --import tsx scripts/composed-admission/journey.mts
          COMPOSED_UNKNOWN=1 COMPOSED_REPORT="$RUNNER_TEMP/composed-admission/unknown-$pass.json" node --import tsx scripts/composed-admission/journey.mts
        done
    - name: Exact owner Factory Result through the MissionControl verifier and MyApps custody
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
        MYEVE_OWNER_RESULT_MC_SOURCE: ${{ github.workspace }}/missioncontrol
        MYEVE_OWNER_RESULT_MC_SHA: f9bcd0df4bb970a36a43599b00d724b07f300ad0
      run: node_modules/.bin/vitest run apps/eve/lib/missioncontrol/permit-store.integration.test.ts apps/eve/lib/missioncontrol/owner-dispatch-race.integration.test.ts apps/eve/lib/missioncontrol/installed-eligibility.integration.test.ts | tee "$RUNNER_TEMP/composed-admission/owner-result.log"
    - name: Caller context, owner/Alpha and legacy isolation, immutable migration lineage
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgresql://postgres@127.0.0.1:5432/postgres
      run: |
        node_modules/.bin/vitest run apps/eve/lib/missioncontrol/owner-alpha-exclusion.integration.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/composed-admission/owner-alpha-exclusion.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/composed-admission/owner-alpha-exclusion.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,18);assert.equal(result.numPassedTests,18);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,18);
        assert.equal(result.testResults[0].name,process.cwd()+'/apps/eve/lib/missioncontrol/owner-alpha-exclusion.integration.test.ts');
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
        node_modules/.bin/vitest run apps/eve/lib/missioncontrol/owner-legacy-isolation.integration.test.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/composed-admission/owner-legacy-isolation.json"
        node --input-type=module - <<'NODE'
        import assert from 'node:assert/strict';
        import {readFileSync} from 'node:fs';
        const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/composed-admission/owner-legacy-isolation.json','utf8'));
        assert.equal(result.success,true);assert.equal(result.numTotalTests,23);assert.equal(result.numPassedTests,23);
        assert.equal(result.numFailedTests,0);assert.equal(result.numPendingTests,0);assert.equal(result.numTodoTests,0);
        assert.equal(result.testResults.length,1);assert.equal(result.testResults[0].assertionResults.length,23);
        assert.ok(result.testResults[0].name.endsWith('/apps/eve/lib/missioncontrol/owner-legacy-isolation.integration.test.ts'));
        assert.ok(result.testResults[0].assertionResults.every(test=>test.status==='passed'));
        NODE
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: unified-composed-admission
        path: ${{ runner.temp }}/composed-admission
        if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --no-audit --no-fund
    - name: Apply and verify reviewed dependency source mitigation
      run: npm run postinstall && npm run security:patches
    - run: node scripts/protocol-convergence/check-contract.mjs
    - name: Installed permits, feedback authentication and fail-closed feature boundaries
      run: npm exec --workspace apps/eve -- vitest run lib/missioncontrol/execution-permit.test.ts
        lib/missioncontrol/admission-receipt.test.ts lib/missioncontrol/permit-control.test.ts
        lib/missioncontrol/result-protocol.test.ts lib/missioncontrol/installed-client.test.ts
        lib/missioncontrol/relay-lease-client.test.ts lib/beta-feedback-route.test.ts
        lib/external-alpha/features.test.ts lib/external-alpha/proxy.test.ts lib/external-alpha/reconciliation.test.ts lib/missioncontrol/installed-eligibility.test.ts lib/capability-control/runtime.test.ts lib/database-schema.test.ts agent/tools/installed_apps.test.ts
        lib/myapps/local-bootstrap.test.ts lib/myapps-capability-boundary.test.ts lib/myapps-packaging.test.ts
    - run: npm run test --workspace=eve-agent -- lib/relay lib/external-alpha/relay-link.test.ts
    - run: npm run test --workspace=eve-agent -- lib/external-alpha/productive-sandbox-test-fixture.test.ts
    - run: npm run test --workspace=eve-agent -- agent/lib/retained-work-session.test.ts agent/lib/retained-work-summary.test.ts
        agent/hooks/retained-summary-effects.test.ts agent/instructions/persistent-agent.test.ts lib/web-session-revocation.test.ts
        lib/chat-work-selection.test.ts components/owner/chat-work-context.test.tsx lib/engineering/worker-projection.test.ts
    - run: npm run typecheck
    - run: npm run db:migrations:check
    - run: npm test
    - run: npm run build
    timeout-minutes: 35
  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        repository: jaydubya818/MyFactory
        ref: 39b686660571bf8f93b46756378126fafb7c4d7c
        path: .qualification/myfactory
    - uses: actions/checkout@v4
      with:
        repository: jaydubya818/relay
        ref: f05a5639e2f95994778753e6021603ca5a1777fb
        path: .qualification/relay
        persist-credentials: false
    - name: Retain the historical installed Relay comparison object
      working-directory: .qualification/relay
      run: git fetch --no-tags --depth=1 https://github.com/jaydubya818/relay.git 8a8678d675adc8ac7f799d7660071de2256bb231
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --no-audit --no-fund
    - name: Apply and verify reviewed dependency source mitigation
      run: npm run postinstall && npm run security:patches
    - run: npm ci --prefix .qualification/myfactory --ignore-scripts --no-audit --no-fund
    - name: Isolated receiving transaction and independent witness PostgreSQL
      working-directory: .qualification/myfactory
      run: |
        docker pull postgres:17
        node scripts/qualify-factory-receiver.mjs
    - name: Cache offline qualification image
      run: docker pull node:24-bookworm
    - name: Canonical pricing freshness and historical approval denials
      run: node --test apps/cloud-control/test/pricing-qualification.test.mjs
      working-directory: .qualification/myfactory
    - name: Real PostgreSQL lifecycle and exact Factory authority
      env:
        MYEVE_VALIDATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgres://postgres@127.0.0.1:5432/postgres
        MYFACTORY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myfactory
        MYRELAY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/relay
        MYRELAY_SOURCE_SHA: f05a5639e2f95994778753e6021603ca5a1777fb
        MYEVE_EXTERNAL_ALPHA_PRODUCTIVE_FIXTURE: '1'
        FACTORY_VERIFIER_DOCKER_IMAGE: node:24-bookworm
      run: npm exec --workspace apps/eve -- vitest run --fileParallelism=false --testTimeout=60000 lib/engineering/production-validation-postgres.test.ts
        lib/engineering/production-validation-halt.test.ts lib/web-session-postgres.test.ts lib/external-alpha/allowance-postgres.test.ts
        lib/external-alpha/accounting-postgres.test.ts lib/external-alpha/shared-accounting-postgres.test.ts lib/external-alpha/work-authority-postgres.test.ts
        lib/external-alpha/work-controller-postgres.test.ts lib/external-alpha/result-ingestion-postgres.test.ts lib/external-alpha/productive-journey-postgres.test.ts
        lib/missioncontrol/permit-store.integration.test.ts
        lib/beta-feedback-postgres.test.ts
        lib/relay/installation-validation.test.ts lib/external-alpha/work-config.test.ts lib/external-alpha/work-action.test.ts
    - name: Historical installed Relay schema compatibility (not the selected release)
      env:
        MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgres://postgres@127.0.0.1:5432/postgres
        MYRELAY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/relay
        MYRELAY_SOURCE_SHA: 8a8678d675adc8ac7f799d7660071de2256bb231
      run: npm exec --workspace apps/eve -- vitest run lib/relay/installation-validation.test.ts
    - name: Durable owner budget concurrency and UNKNOWN recovery
      env:
        MYEVE_OWNER_CHANNEL_TESTS: '1'
        MYEVE_OWNER_TEST_USER: postgres
        MYEVE_OWNER_TEST_PORT: '5432'
      run: npm exec --workspace apps/eve -- vitest run lib/relay/owner/model-budget.integration.test.mjs
    - name: Independent witness privilege, concurrent CAS and real restore qualification
      env:
        CAPABILITY_WITNESS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
        CAPABILITY_TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      run: |
        sudo apt-get update
        sudo apt-get install --yes postgresql-client-16
        node --import tsx --test packages/capability-enforcement/test/postgres-recovery-witness.test.ts
    timeout-minutes: 35
  protected-verifier:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24
    - run: npm ci --ignore-scripts --no-audit --no-fund
    - run: npm run postinstall && npm run security:patches
    - name: Retrieve exact existing offline verifier image
      env:
        PROTECTED_VERIFIER_IMAGE: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
      run: 'docker pull --platform=linux/arm64 "$PROTECTED_VERIFIER_IMAGE"

        docker image inspect "$PROTECTED_VERIFIER_IMAGE" > "$RUNNER_TEMP/protected-verifier-image.json"

        node --input-type=module - <<''NODE''

        import assert from ''node:assert/strict'';

        import {readFileSync} from ''node:fs'';

        const [image] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + ''/protected-verifier-image.json'', ''utf8''));

        assert.equal(process.arch, ''arm64'');

        assert.equal(image.Os, ''linux'');

        assert.equal(image.Architecture, ''arm64'');

        assert.ok(image.RepoDigests.includes(process.env.PROTECTED_VERIFIER_IMAGE));

        console.log(JSON.stringify({image:process.env.PROTECTED_VERIFIER_IMAGE,imageId:image.Id,os:image.Os,architecture:image.Architecture}));

        NODE

        '

name: Owner UX
on:
  push:
    branches: [codex/myeve-owner-experience]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-ux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ux_fixture
          POSTGRES_PASSWORD: local-only
          POSTGRES_DB: blocker_fixes
        ports: ['55491:5432']
        options: >-
          --health-cmd "pg_isready -U ux_fixture -d blocker_fixes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MYEVE_TEST_DATABASE_URL: postgresql://ux_fixture:local-only@localhost:55491/blocker_fixes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chrome
      - name: Focused policy and owner-boundary contracts
        working-directory: apps/eve
        run: npx vitest run lib/external-alpha/features.test.ts lib/external-alpha/proxy.test.ts lib/private-owner-boundary.test.ts lib/owner-browser-storage.test.ts lib/product/owner-work.test.ts lib/engineering/worker-projection.test.ts lib/universal-inbox/inbox.test.ts lib/universal-inbox/integration.test.ts lib/approvals.test.ts
      - name: Initialize disposable database and server
        working-directory: apps/eve
        run: |
          node --import tsx test/owner-ux/setup.ts
          node test/owner-ux/local-server.cjs > /tmp/owner-ux-server.log 2>&1 &
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:3173/login >/dev/null && break; sleep 2; done
      - name: Browser, accessibility, and owner isolation
        working-directory: apps/eve
        run: npx playwright test -c test/owner-ux/playwright.config.cjs
      - name: TypeScript
        working-directory: apps/eve
        run: npx tsc --noEmit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-ux-evidence
          path: |
            output/owner-ux
            /tmp/owner-ux-server.log

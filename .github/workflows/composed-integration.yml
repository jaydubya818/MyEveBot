name: Composed MyEve MissionControl integration
on:
  pull_request:
    paths:
      - apps/eve/**
      - packages/**
      - package.json
      - package-lock.json
      - scripts/security/**
      - .github/workflows/composed-integration.yml
  push:
    branches: [codex/integration-reconcile-20261104]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  actual-backends:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jaydubya818/MissionControl
          ref: df507f8e23ffea37d2a73e4704b005ede75a6574
          path: .qualification/missioncontrol
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: '9.0.0'
          package_json_file: .qualification/missioncontrol/package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts && pnpm run ci:prepare
        working-directory: .qualification/missioncontrol
      - name: Obtain exact local Convex test binary
        shell: bash
        run: |
          curl --fail --location --proto '=https' --output "$RUNNER_TEMP/composed-convex.zip" https://github.com/get-convex/convex-backend/releases/download/precompiled-2026-09-28-5c7cb5b/convex-local-backend-x86_64-unknown-linux-gnu.zip
          echo "5b4adbe9fc2f9985c66eb12b19dadedf2700d8796c839ddba09802196099f241  $RUNNER_TEMP/composed-convex.zip" | sha256sum --check
          mkdir "$RUNNER_TEMP/composed-convex"
          unzip -q "$RUNNER_TEMP/composed-convex.zip" -d "$RUNNER_TEMP/composed-convex"
          chmod +x "$RUNNER_TEMP/composed-convex/convex-local-backend"
      - run: docker pull pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
      - name: Signed command, synthetic owner isolation, duplicate and recovery checks
        env:
          MISSIONCONTROL_SOURCE_ROOT: ${{ github.workspace }}/.qualification/missioncontrol
          MISSIONCONTROL_EXPECTED_SHA: df507f8e23ffea37d2a73e4704b005ede75a6574
          MC_COMPATIBILITY_CONVEX_BINARY: ${{ runner.temp }}/composed-convex/convex-local-backend
        run: node --import tsx apps/eve/test/missioncontrol-consumer.integration.mjs "$RUNNER_TEMP/composed-integration"
      - name: Project budget enforcement across private Missions
        env:
          MC_COMPATIBILITY_CONVEX_BINARY: ${{ runner.temp }}/composed-convex/convex-local-backend
        working-directory: .qualification/missioncontrol
        run: node --import tsx scripts/qualification/workflow-budget-isolation.mjs "$RUNNER_TEMP/composed-integration/workflow-budget"
      - name: Resolve immutable isolated execution dependencies
        env:
          MC_GOLDEN_RUNTIME_FROM_REGISTRY: '1'
        working-directory: .qualification/missioncontrol
        run: node scripts/enterprise-golden-journey/prepare-hosted.mjs hybrid-mission
      - name: Read existing pinned runtime package
        env:
          GHCR_READ_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify exact runtime and fresh deterministic controls
        working-directory: .qualification/missioncontrol
        run: |
          node scripts/enterprise-golden-journey/recover-ghcr-runtime.mjs "$RUNNER_TEMP/composed-runtime"
          node -e 'if(JSON.parse(require("fs").readFileSync(process.argv[1])).status!=="PASS")process.exit(1)' "$RUNNER_TEMP/composed-runtime/recovery.json"
          node --import tsx scripts/qualification/unpublished-verifier-controls.mts "$RUNNER_TEMP/composed-runtime/bundles" "$RUNNER_TEMP/composed-runtime/image.txt" "$RUNNER_TEMP/composed-runtime/registered-controls" "$MC_GOLDEN_DOCKER" "$RUNNER_TEMP/composed-runtime/artifact/image-binding.json" 3
          sudo install -d -m 1777 /private/tmp
      - name: Fresh application intake, Work, Result and all security checks in two cohorts
        env:
          MISSIONCONTROL_SOURCE_ROOT: ${{ github.workspace }}/.qualification/missioncontrol
          MC_GOLDEN_RUNTIME_BUILD: ${{ runner.temp }}/composed-runtime
          MC_OWNER_REVIEW_QUALIFICATION: '1'
        run: node apps/eve/test/checkpoint-h-result-security.mjs "$RUNNER_TEMP/composed-integration/result-security" df507f8e23ffea37d2a73e4704b005ede75a6574
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: composed-integration-evidence
          path: ${{ runner.temp }}/composed-integration
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches

      - run: node scripts/protocol-convergence/check-contract.mjs

      - run: npm run test --workspace=eve-agent -- lib/relay

      - run: npm run test --workspace=eve-agent -- lib/external-alpha/productive-sandbox-test-fixture.test.ts

      - run: npm run test --workspace=eve-agent -- agent/lib/retained-work-session.test.ts agent/lib/retained-work-summary.test.ts agent/hooks/retained-summary-effects.test.ts agent/instructions/persistent-agent.test.ts lib/web-session-revocation.test.ts lib/chat-work-selection.test.ts components/owner/chat-work-context.test.tsx lib/engineering/worker-projection.test.ts components/owner/candidate-decision.test.ts components/qa-silent-failures.test.ts components/owner/resource.dom.test.ts components/task-runs-panel.dom.test.tsx components/owner/owner.test.tsx components/task-run-card.test.tsx components/task-run-card.dom.test.tsx lib/web-auth.test.ts lib/chat-reattach-notice.dom.test.ts components/owner/qa-medium.test.ts components/owner-session-boundary.dom.test.tsx lib/thread-delete.test.ts

      - run: npm run typecheck

      - run: npm run db:migrations:check

      - run: npm test

      - run: npm run build

  # Fixture-mode Playwright tests for QA-12, QA-14, QA-22, QA-39.
  # No DB, no model, no secrets. The app is built from the branch HEAD and
  # started in fixture mode (MYEVE_OWNER_ID=beta-ui-fixture, public password).
  # Tests fail when their specific CSS or auth fix is reverted.
  owner-fixture-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MYEVE_OWNER_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches

      - name: Build the owner fixture app (no secrets, no DB)
        run: npm run build --workspace=eve-agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start fixture server (background)
        working-directory: apps/eve
        run: node test/owner/local-server.cjs &

      - name: Wait for fixture server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3091/api/auth/status >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "Owner fixture did not start within 60 seconds"
          exit 1

      - name: Run adopted QA browser regressions
        working-directory: apps/eve
        run: npx playwright test test/owner/qa-viewport.spec.ts test/owner/qa-14-bfcache.spec.ts --config test/owner/playwright.config.ts --project=desktop --reporter=list

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-fixture-artifacts
          path: output/playwright/beta-product-experience/
          retention-days: 3

  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: jaydubya818/MyFactory
          ref: 39b686660571bf8f93b46756378126fafb7c4d7c
          path: .qualification/myfactory
      - uses: actions/checkout@v4
        with:
          repository: jaydubya818/relay
          ref: f05a5639e2f95994778753e6021603ca5a1777fb
          path: .qualification/relay
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches
      - run: npm ci --prefix .qualification/myfactory --ignore-scripts --no-audit --no-fund
      - name: Isolated receiving transaction and independent witness PostgreSQL
        working-directory: .qualification/myfactory
        run: |
          docker pull postgres:17
          node scripts/qualify-factory-receiver.mjs
      - name: Cache offline qualification image
        run: docker pull node:24-bookworm
      - name: Canonical pricing freshness and historical approval denials
        run: node --test apps/cloud-control/test/pricing-qualification.test.mjs
        working-directory: .qualification/myfactory
      - name: Real PostgreSQL lifecycle and exact Factory authority
        env:
          MYEVE_VALIDATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
          MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgres://postgres@127.0.0.1:5432/postgres
          MYFACTORY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myfactory
          MYRELAY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/relay
          MYRELAY_SOURCE_SHA: f05a5639e2f95994778753e6021603ca5a1777fb
          MYEVE_EXTERNAL_ALPHA_PRODUCTIVE_FIXTURE: "1"
          FACTORY_VERIFIER_DOCKER_IMAGE: node:24-bookworm
        # Separate test databases share cluster-wide roles; initialize those fixtures serially.
        # Concurrency and race assertions inside each test file still run unchanged.
        run: npm exec --workspace apps/eve -- vitest run --fileParallelism=false --testTimeout=60000 lib/engineering/production-validation-postgres.test.ts lib/engineering/production-validation-halt.test.ts lib/web-session-postgres.test.ts lib/external-alpha/allowance-postgres.test.ts lib/external-alpha/accounting-postgres.test.ts lib/external-alpha/shared-accounting-postgres.test.ts lib/external-alpha/work-authority-postgres.test.ts lib/external-alpha/work-controller-postgres.test.ts lib/external-alpha/result-ingestion-postgres.test.ts lib/external-alpha/productive-journey-postgres.test.ts lib/relay/installation-validation.test.ts lib/external-alpha/work-config.test.ts lib/external-alpha/work-action.test.ts
      - name: Durable owner budget concurrency and UNKNOWN recovery
        env:
          MYEVE_OWNER_CHANNEL_TESTS: '1'
          MYEVE_OWNER_TEST_USER: postgres
          MYEVE_OWNER_TEST_PORT: '5432'
        run: npm exec --workspace apps/eve -- vitest run lib/relay/owner/model-budget.integration.test.mjs

  protected-verifier:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run postinstall && npm run security:patches
      - name: Retrieve exact existing offline verifier image
        env:
          PROTECTED_VERIFIER_IMAGE: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
        run: |
          docker pull --platform=linux/arm64 "$PROTECTED_VERIFIER_IMAGE"
          docker image inspect "$PROTECTED_VERIFIER_IMAGE" > "$RUNNER_TEMP/protected-verifier-image.json"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [image] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/protected-verifier-image.json', 'utf8'));
          assert.equal(process.arch, 'arm64');
          assert.equal(image.Os, 'linux');
          assert.equal(image.Architecture, 'arm64');
          assert.ok(image.RepoDigests.includes(process.env.PROTECTED_VERIFIER_IMAGE));
          console.log(JSON.stringify({image:process.env.PROTECTED_VERIFIER_IMAGE,imageId:image.Id,os:image.Os,architecture:image.Architecture}));
          NODE
      - name: Offline protected positive and failed-review controls
        env:
          QUANTITY_PROTECTED_CORPUS: '1'
        run: node --import tsx --test apps/eve/test/numeric-range-protected.test.mjs

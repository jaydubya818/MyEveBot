name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - run: node scripts/protocol-convergence/check-contract.mjs

      - run: npm run test --workspace=eve-agent -- lib/relay

      - run: npm run test --workspace=eve-agent -- lib/external-alpha/productive-sandbox-test-fixture.test.ts

      - run: npm run test --workspace=eve-agent -- agent/lib/retained-work-session.test.ts agent/lib/retained-work-summary.test.ts agent/hooks/retained-summary-effects.test.ts agent/instructions/persistent-agent.test.ts lib/web-session-revocation.test.ts lib/chat-work-selection.test.ts components/owner/chat-work-context.test.tsx lib/engineering/worker-projection.test.ts

      - run: npm run typecheck

      - run: npm run db:migrations:check

      - run: npm test

      - run: npm run build

  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jaydubya818/MyFactory
          ref: 388232c3053cdd3f55e9e309b72a9d9d95ded55f
          path: .qualification/myfactory
      - uses: actions/checkout@v4
        with:
          repository: jaydubya818/relay
          ref: 8a8678d675adc8ac7f799d7660071de2256bb231
          path: .qualification/relay
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix .qualification/myfactory --ignore-scripts --no-audit --no-fund
      - name: Cache offline qualification image
        run: docker pull node:24-bookworm
      - name: Real PostgreSQL lifecycle and exact Factory authority
        env:
          MYEVE_VALIDATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
          MYEVE_EXTERNAL_ALPHA_TEST_DATABASE: postgres://postgres@127.0.0.1:5432/postgres
          MYFACTORY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myfactory
          MYRELAY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/relay
          MYEVE_EXTERNAL_ALPHA_PRODUCTIVE_FIXTURE: "1"
          FACTORY_VERIFIER_DOCKER_IMAGE: node:24-bookworm
        run: npm exec --workspace apps/eve -- vitest run --fileParallelism=false lib/engineering/production-validation-postgres.test.ts lib/engineering/production-validation-halt.test.ts lib/web-session-postgres.test.ts lib/external-alpha/allowance-postgres.test.ts lib/external-alpha/accounting-postgres.test.ts lib/external-alpha/shared-accounting-postgres.test.ts lib/external-alpha/work-authority-postgres.test.ts lib/external-alpha/work-controller-postgres.test.ts lib/external-alpha/result-ingestion-postgres.test.ts lib/external-alpha/productive-journey-postgres.test.ts lib/relay/installation-validation.test.ts lib/external-alpha/work-config.test.ts lib/external-alpha/work-action.test.ts

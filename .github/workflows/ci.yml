name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - run: npm ci --no-audit --no-fund

      - run: node scripts/protocol-convergence/check-contract.mjs

      - run: npm run test --workspace=eve-agent -- lib/relay

      - run: npm run test --workspace=eve-agent -- agent/lib/retained-work-session.test.ts agent/lib/retained-work-summary.test.ts agent/hooks/retained-summary-effects.test.ts agent/instructions/persistent-agent.test.ts lib/web-session-revocation.test.ts lib/chat-work-selection.test.ts components/owner/chat-work-context.test.tsx lib/engineering/worker-projection.test.ts

      - run: npm run typecheck

      - run: npm run db:migrations:check

      - run: npm test

      - run: npm run build

  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          repository: jaydubya818/MyFactory
          ref: f8fc5177ff6f914311e991a69fe64610fff50506
          path: .qualification/myfactory
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm ci --prefix .qualification/myfactory --ignore-scripts --no-audit --no-fund
      - name: Canonical pricing freshness and historical approval denials
        run: node --test apps/cloud-control/test/pricing-qualification.test.mjs
        working-directory: .qualification/myfactory
      - name: Real PostgreSQL lifecycle and exact Factory authority
        env:
          MYEVE_VALIDATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
          MYFACTORY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myfactory
        run: npm exec --workspace apps/eve -- vitest run --no-file-parallelism lib/engineering/production-validation-postgres.test.ts lib/engineering/production-validation-halt.test.ts lib/web-session-postgres.test.ts
      - name: Durable owner budget concurrency and UNKNOWN recovery
        env:
          MYEVE_OWNER_CHANNEL_TESTS: '1'
          MYEVE_OWNER_TEST_USER: postgres
          MYEVE_OWNER_TEST_PORT: '5432'
        run: npm exec --workspace apps/eve -- vitest run lib/relay/owner/model-budget.integration.test.mjs

  protected-verifier:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retrieve exact existing offline verifier image
        env:
          PROTECTED_VERIFIER_IMAGE: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
        run: |
          docker pull --platform=linux/arm64 "$PROTECTED_VERIFIER_IMAGE"
          docker image inspect "$PROTECTED_VERIFIER_IMAGE" > "$RUNNER_TEMP/protected-verifier-image.json"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const [image] = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/protected-verifier-image.json', 'utf8'));
          assert.equal(process.arch, 'arm64');
          assert.equal(image.Os, 'linux');
          assert.equal(image.Architecture, 'arm64');
          assert.ok(image.RepoDigests.includes(process.env.PROTECTED_VERIFIER_IMAGE));
          console.log(JSON.stringify({image:process.env.PROTECTED_VERIFIER_IMAGE,imageId:image.Id,os:image.Os,architecture:image.Architecture}));
          NODE
      - name: Offline protected positive and failed-review controls
        env:
          QUANTITY_PROTECTED_CORPUS: '1'
        run: node --import tsx --test apps/eve/test/numeric-range-protected.test.mjs

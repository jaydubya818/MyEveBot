name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Disposable database for the owner-channel durable-ledger integration tests.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --no-audit --no-fund

      - run: node scripts/protocol-convergence/check-contract.mjs

      - run: npm run test --workspace=eve-agent -- lib/relay

      - name: Owner-channel durable ledger integration tests
        run: npm run test --workspace=eve-agent -- lib/relay/owner/qualification-email.integration.test.mjs lib/relay/owner/model-budget.integration.test.mjs
        env:
          MYEVE_OWNER_CHANNEL_TESTS: "1"
          MYEVE_OWNER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - run: npm run typecheck

      - run: npm run db:migrations:check

      - run: npm test

      - run: npm run build

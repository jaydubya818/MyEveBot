name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches

      - run: node scripts/protocol-convergence/check-contract.mjs

      - run: npm run test --workspace=eve-agent -- lib/relay

      - run: npm run test --workspace=eve-agent -- agent/lib/retained-work-session.test.ts agent/lib/retained-work-summary.test.ts agent/hooks/retained-summary-effects.test.ts agent/instructions/persistent-agent.test.ts lib/web-session-revocation.test.ts lib/chat-work-selection.test.ts components/owner/chat-work-context.test.tsx lib/engineering/worker-projection.test.ts

      - run: npm run typecheck

      - run: npm run db:migrations:check

      - run: npm test

      - run: npm run build

  # Fixture-mode Playwright tests for QA-12, QA-14, QA-22, QA-39.
  # No DB, no model, no secrets. The app is built from the branch HEAD and
  # started in fixture mode (MYEVE_OWNER_ID=beta-ui-fixture, public password).
  # Tests fail when their specific CSS or auth fix is reverted.
  owner-fixture-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches

      - name: Build the owner fixture app (no secrets, no DB)
        run: npm run build --workspace=eve-agent

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start fixture server (background)
        working-directory: apps/eve
        run: node test/owner/local-server.cjs &

      - name: Wait for fixture server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3091/api/auth/status >/dev/null 2>&1; then
              echo "Server ready"; break
            fi
            echo "Waiting... ($i)"; sleep 2
          done

      - name: Run viewport and BFCache Playwright tests
        working-directory: apps/eve
        run: >
          npx playwright test
          test/owner/qa-viewport.spec.ts
          test/owner/qa-14-bfcache.spec.ts
          --config test/owner/playwright.config.ts
          --project=desktop
          --reporter=list

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-fixture-artifacts
          path: output/playwright/beta-product-experience/
          retention-days: 3

  postgres-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jaydubya818/MyFactory
          ref: 18fda16843257a673ea040195ce0ca145a447e6c
          path: .qualification/myfactory
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply and verify reviewed dependency source mitigation
        run: npm run postinstall && npm run security:patches
      - run: npm ci --prefix .qualification/myfactory --ignore-scripts --no-audit --no-fund
      - name: Real PostgreSQL lifecycle and exact Factory authority
        env:
          MYEVE_VALIDATION_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
          MYFACTORY_SOURCE_ROOT: ${{ github.workspace }}/.qualification/myfactory
        # Separate test databases share cluster-wide roles; initialize those fixtures serially.
        # Concurrency and race assertions inside each test file still run unchanged.
        run: npm exec --workspace apps/eve -- vitest run --no-file-parallelism lib/engineering/production-validation-postgres.test.ts lib/engineering/production-validation-halt.test.ts lib/web-session-postgres.test.ts
